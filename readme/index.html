<!DOCTYPE html>
<!-- Documento HTML5 en español -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Permite que la página se adapte al ancho del dispositivo (responsivo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo de Productos</title>
    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="styles.css">
    <!-- Script de lógica. "defer" espera a que cargue el HTML antes de ejecutarlo -->
    <script src="app.js" defer></script>
</head>
<body>
    <!-- Contenedor vacío: JavaScript insertará aquí todo el catálogo -->
    <main id="app"></main>
</body>
</html>
